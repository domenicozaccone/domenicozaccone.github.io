  <!-- Client-Side Host Differentiation Script (Breaks Canonicalization Across Mirrors) -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const host = window.location.hostname;
      const titleTag = document.querySelector("title");
      const mainHeading = document.querySelector("h1");
      const mainDesc = document.querySelector("#node-description");

      if (host.includes("vercel.app")) {
        document.title = "Domenico Zaccone | Software Developer Portfolio & Projects";
        if (mainHeading) mainHeading.textContent = "Domenico Zaccone — Vercel Node";
        if (mainDesc) mainDesc.textContent = "Official Vercel deployment node for Domenico Zaccone (Dom Zaccone). Showcasing web applications, software engineering projects, and code repositories.";
      } 
      else if (host.includes("netlify.app")) {
        document.title = "Domenico Zaccone — Web & Game Development Hub";
        if (mainHeading) mainHeading.textContent = "Domenico Zaccone — Netlify Node";
        if (mainDesc) mainDesc.textContent = "Official Netlify mirror node for Domenico Zaccone (Dom Zaccone). Software projects, interactive applications, and development archives.";
      } 
      else if (host.includes("workers.dev")) {
        document.title = "Domenico Zaccone | Technical Documentation & Code";
        if (mainHeading) mainHeading.textContent = "Domenico Zaccone — Cloudflare Node";
        if (mainDesc) mainDesc.textContent = "Official Cloudflare edge node for Domenico Zaccone (Dom Zaccone). Technical documentation, API endpoints, and repository links.";
      }
    });
  </script>
